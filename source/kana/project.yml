name: kana
options:
  bundleIdPrefix: com.salmonapps.app
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  defaultConfig: Release
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.10.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.19.2
settings:
  base:
    DEVELOPMENT_TEAM: 72T2SXUWHC
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "17"
    OTHER_LDFLAGS: "-ObjC"
targets:
  kana:
    type: application
    platform: iOS
    sources:
      - path: kana
        excludes:
          - "Info.plist"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salmonapps.app.kana
        INFOPLIST_FILE: kana/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalytics
      - sdk: StoreKit.framework
      - sdk: AppTrackingTransparency.framework
      - sdk: MessageUI.framework
      - sdk: AVFoundation.framework
  kanaTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - path: kanaTests
      - path: Configuration.storekit
        buildPhase: resources
    dependencies:
      - target: kana
      - sdk: StoreKitTest.framework
  kanaUITests:
    type: bundle.ui-testing
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources:
      - path: kanaUITests
    dependencies:
      - target: kana
schemes:
  kana:
    build:
      targets:
        kana: all
        kanaTests: [test]
        kanaUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      targets:
        - kanaTests
        - kanaUITests
    archive:
      config: Release
