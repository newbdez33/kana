<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="四个选项，五秒一题。辨认平假名、片假名和罗马音，挑战你的五十音连对纪录。">
  <title>Kana · 五十音</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <div class="app">
    <main class="play-board" aria-label="五十音练习">
      <section class="question-panel" id="question-panel">
        <nav class="practice-menu" id="practice-menu" aria-label="练习工具" hidden><button class="quiet-button" id="chart-open">五十音图</button><button class="quiet-button" id="pause" disabled>暂停</button><span id="storage-note">记录保存在本机</span></nav>
        <header class="header"><h1>练习记录</h1><button class="menu-toggle" id="menu-toggle" aria-label="菜单" aria-controls="practice-menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button></header>
        <section class="statistics" aria-label="练习记录">
          <div><strong id="answer-count">0</strong><span>累计答题</span></div>
          <div><strong id="average-time">—</strong><span>平均用时</span></div>
          <div><strong id="recent-time">—</strong><span>最近 10 题</span></div>
          <div><strong class="streak-value" id="best-streak">0</strong><span>最长连对</span></div>
          <div><strong class="streak-value" id="streak">0</strong><span>连对</span></div>
        </section>
        <div class="question-content" id="question-content" aria-hidden="true">
          <div class="question-top"><span id="prompt-type">平假名</span><span class="timer" id="timer" aria-hidden="true"><span id="timer-value">5.0</span><small>s</small></span></div>
          <div class="time-track" role="progressbar" aria-label="本题剩余时间" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5" id="time-progress"><div id="time-fill"></div></div>
          <div class="prompt-space"><div class="prompt-disc"></div><span class="prompt kana" id="prompt" lang="ja">あ</span></div>
          <div class="feedback-row"><p id="feedback" role="status" aria-live="polite"></p><button class="next-button" id="next" hidden>下一题 <span aria-hidden="true">→</span></button></div>
          <div class="pause-panel" id="pause-panel" hidden><h2>已暂停</h2><button class="primary-button" id="resume">继续练习</button></div>
        </div>
        <aside class="banner-slot" id="banner-slot" aria-label="广告" hidden><span>广告</span><button id="banner-close" aria-label="关闭广告">×</button></aside>
      </section>
      <section class="answers-panel" id="answers-panel" aria-label="四个答案" aria-hidden="true">
          <div class="answers" id="answers">
            <button class="answer" disabled><span class="answer-key" aria-hidden="true">Q</span><span class="kana answer-label">a</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key" aria-hidden="true">W</span><span class="kana answer-label">ぬ</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key" aria-hidden="true">A</span><span class="kana answer-label">ナ</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key" aria-hidden="true">S</span><span class="kana answer-label">ne</span><span class="answer-mark" aria-hidden="true"></span></button>
          </div>
          <p class="keyboard-help">Q / W / A / S 作答 · ↑ ↓ ← → 移动 · 回车 / 空格确认</p>
      </section>
        <div class="start-panel" id="start-panel"><span class="start-kana kana" lang="ja" aria-hidden="true">あ</span><h2>从一个假名开始。</h2><p>看清题目，选出对应的假名或罗马音。<br>答错也没关系，记住答案再来一题。</p><button class="primary-button" id="start">开始挑战 <span aria-hidden="true">→</span></button><span class="start-note" id="load-status">46 个基础假名 · 随时暂停</span></div>
    </main>
  </div>

  <dialog id="chart" aria-labelledby="chart-title">
    <header class="chart-header"><div><p class="eyebrow">随手查一查</p><h2 id="chart-title">五十音图</h2></div><button class="icon-button" id="chart-close" aria-label="关闭五十音图">×</button></header>
    <div class="chart-tabs" role="group" aria-label="假名种类"><button id="hiragana" aria-pressed="true">平假名</button><button id="katakana" aria-pressed="false">片假名</button></div>
    <div class="chart-grid" id="chart-grid"></div><p class="chart-note">查看五十音图时，答题计时暂停。</p>
  </dialog>
  <noscript><p class="script-notice">请启用 JavaScript 后开始五十音练习。</p></noscript>
</body>
</html>
