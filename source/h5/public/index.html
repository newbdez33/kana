<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ef">
  <meta name="description" content="四个选项，五秒一题。辨认平假名、片假名和罗马音，挑战你的五十音连对纪录。">
  <title>Kana · 五十音</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="Kana 五十音首页"><span class="brand-mark" aria-hidden="true">あ</span><span>Kana<span class="brand-caption">五十音</span></span></a>
      <nav aria-label="练习工具"><button class="quiet-button" id="chart-open">五十音图 <span aria-hidden="true">↗</span></button><button class="quiet-button" id="pause" disabled>暂停</button></nav>
    </header>

    <main aria-label="五十音挑战">
      <section class="statistics" aria-label="练习记录">
        <div><span>连对</span><strong class="streak-value" id="streak">0</strong></div>
        <div><span>最高</span><strong id="best-streak">0</strong></div>
        <div><span>答题数</span><strong id="answer-count">0</strong></div>
        <div><span>平均用时</span><strong id="average-time">—</strong></div>
        <div><span>近 10 题</span><strong id="recent-time">—</strong></div>
      </section>

      <section class="play-board" aria-label="五十音练习">
        <div class="question-panel" id="question-panel" aria-hidden="true">
          <div class="question-top"><span class="chip" id="prompt-type">平假名</span><span class="timer" id="timer" aria-hidden="true"><span id="timer-value">5.0</span><small>s</small></span></div>
          <div class="prompt-space"><div class="prompt-disc"></div><span class="prompt kana" id="prompt" lang="ja">あ</span></div>
          <div class="time-track" role="progressbar" aria-label="本题剩余时间" aria-valuemin="0" aria-valuemax="5" aria-valuenow="5" id="time-progress"><div id="time-fill"></div></div>
        </div>
        <div class="answers-panel" id="answers-panel" aria-hidden="true">
          <div class="answer-heading"><span>找到它的另一种写法</span><span class="key-hint">Q W / A S 直接作答</span></div>
          <div class="answers" id="answers">
            <button class="answer" disabled><span class="answer-key">Q</span><span class="kana answer-label">a</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key">W</span><span class="kana answer-label">ぬ</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key">A</span><span class="kana answer-label">ナ</span><span class="answer-mark" aria-hidden="true"></span></button>
            <button class="answer" disabled><span class="answer-key">S</span><span class="kana answer-label">ne</span><span class="answer-mark" aria-hidden="true"></span></button>
          </div>
          <p class="keyboard-help">↑ ↓ ← → 移动 · 回车 / 空格确认</p>
        </div>
        <div class="start-panel" id="start-panel"><span class="start-kana kana" lang="ja" aria-hidden="true">あ</span><h2>从一个假名开始。</h2><p>看清题目，选出对应的假名或罗马音。<br>答错也没关系，记住答案再来一题。</p><button class="primary-button" id="start">开始挑战 <span aria-hidden="true">→</span></button><span class="start-note" id="load-status">46 个基础假名 · 随时暂停</span></div>
        <div class="pause-panel" id="pause-panel" hidden><span class="eyebrow">休息一下</span><h2>这一题，等你回来。</h2><button class="primary-button" id="resume">继续练习 <span aria-hidden="true">→</span></button></div>
      </section>

      <div class="feedback-row"><p id="feedback" role="status" aria-live="polite">准备好，就开始吧。</p><button class="next-button" id="next" hidden>下一题 <span aria-hidden="true">→</span></button></div>
    </main>
    <footer><span>Jacky工作室</span><span id="storage-note">记录保存在本机</span></footer>
  </div>

  <dialog id="chart" aria-labelledby="chart-title">
    <header class="chart-header"><div><p class="eyebrow">随手查一查</p><h2 id="chart-title">五十音图</h2></div><button class="icon-button" id="chart-close" aria-label="关闭五十音图">×</button></header>
    <div class="chart-tabs" role="group" aria-label="假名种类"><button id="hiragana" aria-pressed="true">平假名</button><button id="katakana" aria-pressed="false">片假名</button></div>
    <div class="chart-grid" id="chart-grid"></div><p class="chart-note">查看五十音图时，答题计时暂停。</p>
  </dialog>
  <noscript><p class="script-notice">请启用 JavaScript 后开始五十音练习。</p></noscript>
</body>
</html>
